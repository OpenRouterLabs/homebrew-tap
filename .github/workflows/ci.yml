name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check tap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Homebrew on Linux
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /home/linuxbrew/.linuxbrew
          sudo chown -R "$USER" /home/linuxbrew/.linuxbrew
          git clone --depth=1 https://github.com/Homebrew/brew /home/linuxbrew/.linuxbrew/Homebrew
          mkdir -p /home/linuxbrew/.linuxbrew/bin
          ln -s ../Homebrew/bin/brew /home/linuxbrew/.linuxbrew/bin/brew
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Register checkout as tap
        run: brew tap OpenRouterTeam/tap "$GITHUB_WORKSPACE"

      - name: Check formulae
        run: scripts/check

      - name: Install and test Ori
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install OpenRouterTeam/tap/ori
          brew test OpenRouterTeam/tap/ori
